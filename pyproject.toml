[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scripter-redteam"
version = "0.1.0"
description = "Authorized red-team automation toolkit for Attack-vs-Defense CTF competitions and isolated cyber ranges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.0,<15",
    "textual>=0.60,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
scripter = "scripter.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires real network access to a live target, not run by default",
]

# Scripter red-team configuration. Copy this file to config/config.toml
# and edit it before running any active command. There is no default
# scope - [scope] targets must be set explicitly, or discover/enumerate/
# vuln-map/validate will all refuse to run.

[scope]
# One or more hosts/CIDR ranges you are explicitly authorized to target,
# e.g. a competition-provided range or an isolated lab network.
# Example: targets = ["10.10.1.0/24", "10.10.2.5"]
targets = []
# Set true only if the competition explicitly assigns public IP ranges.
allow_public = false
# Safety valve against an overly broad CIDR typo expanding into a huge sweep.
max_hosts = 4096

[storage]
data_dir = "data"
reports_dir = "reports"
db_path = "data/scripter.db"

[logging]
level = "INFO"          # DEBUG, INFO, WARNING, ERROR
log_dir = "data/logs"
max_bytes = 5000000
backup_count = 3

[scan]
# Ports probed during discover/enumerate. Narrow this to the target OS's
# actual service mix once known, to keep sweeps fast and focused.
ports = [
    21, 22, 23, 25, 53, 80, 110, 111, 135, 139, 143, 443, 445, 993, 995,
    1433, 1521, 2049, 3306, 3389, 5432, 5900, 6379, 6667, 8000, 8080, 8443, 9200, 27017,
]
timeout_seconds = 2.0
# Bounded concurrency - keep this well under anything that could look like
# a stress test against shared competition infrastructure.
max_concurrency = 50
# Optional richer version detection via `nmap -sV` (read-only; no NSE
# vuln/exploit scripts, no raw-socket scanning). Requires nmap on PATH.
use_nmap = false

[validate]
# Opt-in gate for the non-destructive validation checks in
# validation/checks.py (anonymous FTP login, unauthenticated Redis PING,
# weak TLS handshake). Leave false until you've confirmed scope is correct.
enabled = false
timeout_seconds = 5.0

[redteam]
# Master switch for the redteam/ planning+execution extension. Planning
# (`scripter redteam plan`), `list-tools`, and `simulate` stay available
# even when this is left at its default - they are offline/deterministic
# by construction. Only real network audits/external tools are
# separately gated below.
enabled = true
# Deterministic offline mock execution (`scripter redteam simulate`) -
# safe by default, never touches the network.
simulate_enabled = true
# Real network-touching audits (http_audit/tls_audit/ftp_audit/
# redis_audit/ssh_audit/smtp_audit/mysql_audit/diagnostics via
# `scripter redteam audit-*`/`diagnostics`). Leave false until scope is
# confirmed correct, same as [validate].
network_audits_enabled = false
# External tool adapters (currently: nmap_adapter, which just wraps the
# existing nmap -sV wrapper). Requires nmap on PATH regardless of this
# flag; this additionally gates whether redteam will ever invoke it.
external_tools_enabled = false
max_concurrency = 10
timeout_seconds = 5.0
# Hard cap on bytes read from any single HTTP(S) audit response.
max_response_bytes = 65536
# Which tool categories redteam is allowed to run at all. Narrow this to
# restrict the toolkit to a subset (e.g. ["http", "tls"]) for a
# specific competition.
allowed_categories = ["http", "tls", "ftp", "redis", "ssh", "smtp", "mysql", "diagnostics", "nmap", "passive"]
# Evidence strings are redacted (see redteam/results.py) and then capped
# at this length before being stored or reported.
max_evidence_chars = 2000

[intel]
# Opt-in gate for the Findings tab's "Look up CVEs (NVD)" button and the
# `scripter cve-lookup` CLI command (intel/cve_lookup.py) - the only
# outbound call in this toolkit that targets a third party (the public
# NVD CVE API) instead of something inside [scope]. Leave false until
# you've confirmed this box has (or should have) internet access.
cve_lookup_enabled = false
cve_lookup_timeout_seconds = 10.0
# NVD results requested per service/version pair.
cve_lookup_max_results = 5
# Hard cap on how many distinct service/version pairs one bulk lookup
# will query, so a large run doesn't turn into dozens of outbound requests.
cve_lookup_max_pairs = 15
# Pause between pairs - NVD's public rate limit without an API key is
# 5 requests/30s; 6s keeps a multi-pair lookup comfortably under that.
cve_lookup_delay_seconds = 6.0
# Optional NVD API key (https://nvd.nist.gov/developers/request-an-api-key)
# raises the rate limit to 50 requests/30s. Leave blank to use the public
# rate limit.
nvd_api_key = ""
